[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdmon-futures"
version = "0.1.0"
description = "COT positioning and forced-flow monitor for futures. Consumes cotdata and marketdata; ships no strategy."
readme = "README.md"
authors = [
    {name = "Matt S.", email = "cotanalyzer@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "pyarrow>=10",
]

[project.urls]
Homepage = "https://github.com/mspinola/crowdmon-futures"
Repository = "https://github.com/mspinola/crowdmon-futures"
Issues = "https://github.com/mspinola/crowdmon-futures/issues"

[project.optional-dependencies]
# cotdata and marketdata are SIBLING checkouts installed editable, not PyPI pins, so they
# are deliberately absent from `dependencies`. Declaring them would make a fresh CI runner
# resolve published versions while local work resolves the working tree, which is exactly
# the drift the workspace's editable-install layout exists to avoid. CI installs them from
# ../ the same way the local venvs do.
dev = ["pytest>=7", "ruff==0.15.22"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_vintage: requires a store with captured vintage observations"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
