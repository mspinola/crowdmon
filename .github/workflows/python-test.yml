name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
      with:
        path: crowdmon-futures

    # cotdata and marketdata are SIBLING checkouts installed editable, not PyPI pins, so
    # CI has to reproduce the workspace layout rather than resolve released versions. That
    # is deliberate: resolving published versions here while local work resolves the
    # working tree is exactly the drift that would make a green CI run meaningless.
    # It also means a breaking change in either producer turns this build red, which is
    # the point of a consumer's test suite.
    - uses: actions/checkout@v4
      with:
        repository: mspinola/cotdata
        path: cotdata
    - uses: actions/checkout@v4
      with:
        repository: mspinola/marketdata
        path: marketdata

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      working-directory: crowdmon-futures
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]" -e ../cotdata -e ../marketdata

    - name: Run linting
      working-directory: crowdmon-futures
      run: python -m ruff check src tests

    - name: Run tests
      working-directory: crowdmon-futures
      env:
        # cotdata guards on this at import, so every test needs a real path even though
        # the ones that write use the tmp_path store fixture.
        COTDATA_STORE: /tmp/cotdata_store
      run: |
        mkdir -p /tmp/cotdata_store
        pytest tests/ -q
