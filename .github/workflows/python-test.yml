name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
      with:
        path: crowdmon

    # cotdata and marketdata are SIBLING checkouts installed editable, not PyPI pins, so
    # CI has to reproduce the workspace layout rather than resolve released versions. That
    # is deliberate: resolving published versions here while local work resolves the
    # working tree is exactly the drift that would make a green CI run meaningless.
    # It also means a breaking change in either producer turns this build red, which is
    # the point of a consumer's test suite.
    - uses: actions/checkout@v4
      with:
        repository: mspinola/cotdata
        path: cotdata
    - uses: actions/checkout@v4
      with:
        repository: mspinola/marketdata
        path: marketdata

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      working-directory: crowdmon
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]" -e ../cotdata -e ../marketdata

    - name: Run linting
      working-directory: crowdmon
      run: python -m ruff check src tests bin

    - name: Run tests
      working-directory: crowdmon
      env:
        # cotdata guards on this at import, so every test needs a real path even though
        # the ones that write use the tmp_path store fixture.
        COTDATA_STORE: /tmp/cotdata_store
        CROWDMON_SKIP_REPORT: /tmp/crowdmon-skips.json
      run: |
        mkdir -p /tmp/cotdata_store
        # -rs so the skipped live-store tests are VISIBLE. CI has no store, so
        # everything in test_contract_master_live.py skips here, and a green run
        # that silently skipped the only tests touching real data would be worse
        # than a red one.
        pytest tests/ -q -rs

    # Visible was never enough: nothing read the -rs output, so a test that quietly
    # started skipping looked identical to one that passed. This asserts the skip set is
    # the one a FIXTURE store should produce, and fails on any new reason. It cannot
    # verify a real-store number -- the data is Norgate-licensed and this repo is public,
    # so that job runs nightly on the developer machine instead. See bin/check_skips.py.
    - name: Check the skip set is the expected one
      working-directory: crowdmon
      run: python bin/check_skips.py --profile ci /tmp/crowdmon-skips.json
